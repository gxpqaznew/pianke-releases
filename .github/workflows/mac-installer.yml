name: Android cloud password check
on:
  push:
    branches: [codex/android-cloud-check]
    paths: [.github/workflows/mac-installer.yml]
permissions:
  contents: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE: https://github.com/gxpqaznew/pianke-releases/releases/download
      VERSION: 1.0.43
      PREVIOUS_VERSION: 1.0.42
      APK_SHA: 20e83723438f685886a876bbaab279f95a478fb413a24d6fd50d8892de4ace60
    steps:
      - name: Upgrade Android and check the saved-password control
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          image="system-images;android-34;google_apis;x86_64"
          export PATH="$sdk/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "$image" > "$RUNNER_TEMP/sdk.log"
          printf 'no\n' | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --name pianke-release --package "$image" --path "$ANDROID_AVD_HOME/pianke-release.avd" --force
          "$sdk/emulator/emulator" -list-avds | grep -x 'pianke-release'
          export ANDROID_SERIAL=emulator-5554
          "$sdk/emulator/emulator" -avd pianke-release -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emu.log" 2>&1 &
          trap 'adb emu kill || true; tail -40 "$RUNNER_TEMP/emu.log"' EXIT
          curl -fsSLo "$RUNNER_TEMP/old.apk" "$RELEASE/v$PREVIOUS_VERSION/Pianke-Android.apk"
          curl -fsSLo "$RUNNER_TEMP/new.apk" "$RELEASE/v$VERSION/Pianke-Android.apk"
          printf '%s  %s\n' "$APK_SHA" "$RUNNER_TEMP/new.apk" | sha256sum -c
          timeout 180 adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          adb install "$RUNNER_TEMP/old.apk"
          adb shell pm grant cn.watchroom.pianike android.permission.POST_NOTIFICATIONS
          adb shell am start -W -n cn.watchroom.pianike/.MainActivity
          adb shell input keyevent KEYCODE_HOME
          adb install -r "$RUNNER_TEMP/new.apk"
          for i in $(seq 1 20); do
            adb shell dumpsys notification --noredact > "$RUNNER_TEMP/notifications.txt"
            if grep -Fq '片刻已更新' "$RUNNER_TEMP/notifications.txt"; then break; fi
            sleep 1
          done
          grep -F '片刻已更新' "$RUNNER_TEMP/notifications.txt"
          grep -F "已安装片刻 $VERSION" "$RUNNER_TEMP/notifications.txt"
          adb shell dumpsys jobscheduler > "$RUNNER_TEMP/jobs.txt"
          grep -F 'cn.watchroom.pianike/.AppUpdateJob' "$RUNNER_TEMP/jobs.txt"
          adb shell cmd statusbar expand-notifications
          sleep 2
          adb shell uiautomator dump /sdcard/pianke-shade.xml
          adb pull /sdcard/pianke-shade.xml "$RUNNER_TEMP/shade.xml"
          read -r x y < <(python3 - "$RUNNER_TEMP/shade.xml" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1])
          node = next(node for node in root.iter("node") if "片刻已更新" in node.get("text","") or "片刻已更新" in node.get("content-desc",""))
          left, top, right, bottom = map(int, re.findall(r"\d+", node.get("bounds","")))
          print((left+right)//2,(top+bottom)//2)
          PY
          )
          adb shell input tap "$x" "$y"
          for i in $(seq 1 8); do
            adb shell uiautomator dump /sdcard/pianke-screen.xml || true
            adb pull /sdcard/pianke-screen.xml "$RUNNER_TEMP/screen.xml" || true
            if grep -Fq '当前发布通道没有更新的版本。' "$RUNNER_TEMP/screen.xml"; then break; fi
            sleep 2
          done
          grep -Fq '检查软件更新' "$RUNNER_TEMP/screen.xml"
          grep -Fq '当前发布通道没有更新的版本。' "$RUNNER_TEMP/screen.xml"
          echo "The system notification opened the software update screen and the public manifest was read successfully."
          screen() {
            adb shell rm -f /sdcard/pianke-cloud.xml
            adb shell uiautomator dump /sdcard/pianke-cloud.xml >/dev/null &&
              adb pull /sdcard/pianke-cloud.xml "$RUNNER_TEMP/cloud.xml" >/dev/null 2>&1
          }
          locate() {
            python3 - "$RUNNER_TEMP/cloud.xml" "$1" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          nodes = list(ET.parse(sys.argv[1]).iter("node"))
          target = sys.argv[2]
          if target in ("field-first", "field-second"):
              fields = [node for node in nodes if node.get("class") == "android.widget.EditText"]
              index = 0 if target == "field-first" else 1
              node = fields[index] if len(fields) > index else None
          else:
              aliases = {"reveal": ("显示已保存密码", "显示密码"), "conceal": ("隐藏已保存密码", "隐藏")}
              labels = aliases.get(target, (target,))
              exact = [node for node in nodes if node.get("text") in labels or node.get("content-desc") in labels]
              similar = [node for node in nodes if any(label in node.get("text","") or label in node.get("content-desc","") for label in labels)]
              node = next(iter(sorted(exact or similar, key=lambda item: item.get("clickable") != "true")), None)
          if node is None:
              raise SystemExit(1)
          left, top, right, bottom = map(int, re.findall(r"\d+", node.get("bounds","")))
          print((left+right)//2, (top+bottom)//2)
          PY
          }
          wait_for() {
            local target="$1" point
            for _ in $(seq 1 14); do
              if screen && point=$(locate "$target"); then printf '%s\n' "$point"; return; fi
              sleep 1
            done
            printf 'Cloud screen target missing: %s\n' "$target" >&2
            python3 - "$RUNNER_TEMP/cloud.xml" <<'PY' >&2
          import sys
          import xml.etree.ElementTree as ET
          for node in ET.parse(sys.argv[1]).iter("node"):
              if node.get("text") or node.get("content-desc"):
                  print(node.get("class"), node.get("text"), node.get("content-desc"), node.get("bounds"))
          PY
            return 1
          }
          tap() {
            local x y
            read -r x y <<< "$(wait_for "$1")"
            adb shell input tap "$x" "$y"
          }
          hide_keyboard() {
            local status
            status=$(adb shell dumpsys input_method)
            if [[ "$status" == *"mInputShown=true"* ]]; then adb shell input keyevent KEYCODE_BACK; fi
          }
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell input keyevent KEYCODE_BACK
          tap 云同步
          tap field-first
          adb shell input text 'pianke-fixture@example.test'
          hide_keyboard
          tap field-second
          adb shell input text 'fixture43-code'
          hide_keyboard
          wait_for fixture43-code >/dev/null
          tap 连接并同步
          wait_for 保存设置并同步 >/dev/null
          adb shell input keyevent KEYCODE_BACK
          tap 云同步
          adb shell input swipe 160 530 160 280 420
          wait_for reveal >/dev/null
          if grep -Fq 'fixture43-code' "$RUNNER_TEMP/cloud.xml"; then exit 1; fi
          tap reveal
          wait_for '正在显示本机已保存的应用密码。' >/dev/null
          wait_for fixture43-code >/dev/null
          tap conceal
          wait_for reveal >/dev/null
          if grep -Fq 'fixture43-code' "$RUNNER_TEMP/cloud.xml"; then exit 1; fi
          echo "Android displayed and cleared the locally saved password."




