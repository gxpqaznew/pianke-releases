name: Build Pianke Mac preview
on:
  push:
    branches: [codex/mac-1-0-45-preview]
    paths: [.github/workflows/mac-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            digest: 7c3c0f3815ce19175bd296ef9cdf1df0e34bf285881be43319e4342add00bd1e
          - arch: x64
            runner: macos-15-intel
            digest: 3c39b3c69b8e8cda9efb96ce25b65f0075d16889c15b9e74ca4c680cb2a0c1e9
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      ARCH: ${{ matrix.arch }}
      DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble preview installer and verify it on macOS
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/output"
          seed="$RUNNER_TEMP/seed.zip"
          staging="$RUNNER_TEMP/staging"
          base="https://github.com/gxpqaznew/pianke-releases/releases/download"
          mkdir -p "$out" "$staging"
          curl -fsSL --retry 3 "$base/v1.0.45-mac-preview/Pianke-Mac-Seed-$ARCH.zip" -o "$seed"
          printf '%s  %s\n' "$DIGEST" "$seed" | shasum -a 256 -c
          ditto -x -k "$seed" "$RUNNER_TEMP/unpacked"
          app="$RUNNER_TEMP/unpacked/片刻.app"
          pl="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier cn.watchroom.pianike' "$pl"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1.0.45' "$pl"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.45' "$pl"
          grep -F 'installMacUpdate' "$app/Contents/Resources/app/app-update.cjs"
          grep -F '1.0.45' "$app/Contents/Resources/app/package.json"
          while IFS= read -r -d '' item; do
            codesign --force --sign - "$item"
          done < <(find "$app/Contents/Frameworks" -type f \( -name '*.dylib' -o -name '*.node' -o -name chrome_crashpad_handler -o -name ShipIt \) -print0)
          while IFS= read -r -d '' item; do
            codesign --force --sign - "$item"
          done < <(find "$app/Contents/Frameworks" -depth \( -name '*.app' -o -name '*.framework' \) -type d -print0)
          codesign --force --sign - "$app"
          codesign --verify --strict --deep "$app"
          ditto "$app" "$staging/片刻.app"
          pkg="$out/Pianke-Mac-$ARCH-1.0.45-Preview.pkg"
          pkgbuild --analyze --root "$staging" "$RUNNER_TEMP/component.plist"
          /usr/libexec/PlistBuddy -c 'Set :0:BundleIsRelocatable false' "$RUNNER_TEMP/component.plist"
          pkgbuild --root "$staging" --component-plist "$RUNNER_TEMP/component.plist" --identifier cn.watchroom.pianike.pkg --version 1.0.45 --install-location /Applications "$pkg"
          pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
          grep -F '片刻.app/Contents/MacOS/Electron' "$RUNNER_TEMP/payload.txt"
          previous="$RUNNER_TEMP/previous.pkg"
          curl -fsSL --retry 3 "$base/v1.0.44-mac-preview/Pianke-Mac-$ARCH-1.0.44-Preview.pkg" -o "$previous"
          sudo installer -pkg "$previous" -target /
          target="/Applications/片刻.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$target/Contents/Info.plist")" = 1.0.44
          export WATCHROOM_QA_DIR="$RUNNER_TEMP/pianke-test-profile"
          mkdir -p "$WATCHROOM_QA_DIR/library"
          printf '%s\n' '{"kind":"watchroom-mobile","version":1,"state":{"progress":{"preview-fixture":{"status":"waiting","seasonNumber":3,"note":"preserve"}},"customWorks":[],"followedCreators":[],"hiddenCreators":[]},"tasks":[]}' > "$WATCHROOM_QA_DIR/library/watchroom-v1.json"
          cp "$WATCHROOM_QA_DIR/library/watchroom-v1.json" "$RUNNER_TEMP/expected-profile.json"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Pianke preview test;" "$pkg"
          qa_app="$target/Contents/MacOS/Electron"
          probe="$RUNNER_TEMP/cloud-probe.mjs"
          cat > "$probe" <<'PIANKE_QA'
          import assert from 'node:assert/strict';
          const mode=process.argv[2];
          const origin='http://127.0.0.1:'+(mode==='seed'?9375:9376);
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let page,lastError,lastPages;
          for(let i=0;i<40&&!page;i++){
            try{lastPages=await (await fetch(origin+'/json/list',{signal:AbortSignal.timeout(1000)})).json();page=lastPages.find(page=>page.type==='page'&&page.url.startsWith('watchroom://app/'));}catch(error){lastError=String(error.cause||error);}
            if(!page)await wait(250);
          }
          assert(page,'could not find Pianke: '+mode+' '+lastError+' '+JSON.stringify(lastPages?.map(page=>({type:page.type,url:page.url}))));
          const socket=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{socket.addEventListener('open',resolve,{once:true});socket.addEventListener('error',reject,{once:true});});
          async function evaluate(expression){
            return new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(Error('Mac cloud probe timed out')),19000);
              socket.addEventListener('message',event=>{
                clearTimeout(timer);
                const message=JSON.parse(event.data);
                if(message.error||message.result.exceptionDetails)reject(Error(message.error?.message||message.result.exceptionDetails.exception?.description||'Mac browser assertion failed'));
                else resolve(message.result.result.value);
              },{once:true});
              socket.send(JSON.stringify({id:1,method:'Runtime.evaluate',params:{expression,awaitPromise:true,returnByValue:true}}));
            });
          }
          try{
            const result=await evaluate('('+async function(mode){
              const waitFor=async(fn,label)=>{
                for(let i=0;i<100;i++){const value=fn();if(value)return value;await new Promise(resolve=>setTimeout(resolve,45));}
                throw Error(label);
              };
              const account='preview-mac@example.test';
              const fixture='fixture-password-145';
              await waitFor(()=>window.Watchroom?.platform==='mac','Mac preload is missing');
              if(mode==='seed'){
                const status=await window.Watchroom.cloud('configure',{username:account,password:fixture,enabled:false});
                if(!status.configured||status.username!==account)throw Error('existing version failed to save the encrypted fixture');
                return '1.0.44 saved the fixture using macOS Keychain';
              }
              (await waitFor(()=>[...document.querySelectorAll('button')].find(node=>node.textContent.trim()==='我的'),'settings button missing')).click();
              const section=await waitFor(()=>document.querySelector('.cloud-settings'),'cloud settings missing');
              const input=section.querySelector('.cloud-password input');
              const reveal=await waitFor(()=>section.querySelector('[aria-label="显示已保存密码"]'),section.querySelector('[role="alert"]')?.textContent||'saved authorization not found after upgrade');
              if(input.value)throw Error('password was exposed before the click');
              reveal.click();
              window.dispatchEvent(new Event('blur'));
              await waitFor(()=>!reveal.disabled,'Keychain read did not finish');
              if(input.value)throw Error('password was exposed while focus was away');
              window.dispatchEvent(new Event('focus'));
              await waitFor(()=>input.value===fixture&&input.type==='text','password not visible after focus returned');
              section.querySelector('[aria-label="隐藏已保存密码"]').click();
              await waitFor(()=>input.value===''&&input.type==='password','password was not hidden');
              return '1.0.45 displayed and hid the password saved in 1.0.44 after the window regained focus';
            }.toString()+')('+JSON.stringify(mode)+')');
            console.log(result);
          }finally{socket.close();}
          PIANKE_QA
          # Scoped test-only keychain item, trusted by the two packaged builds.
          qa_keychain="$RUNNER_TEMP/preview-fixture.keychain-db"
          keychain_password=$(openssl rand -hex 20)
          security create-keychain -p "$keychain_password" "$qa_keychain"
          security unlock-keychain -p "$keychain_password" "$qa_keychain"
          security list-keychains -d user -s "$qa_keychain"
          security default-keychain -d user -s "$qa_keychain"
          security add-generic-password -a Watchroom -s 'Watchroom Safe Storage' -w "$(openssl rand -hex 24)" -T "$qa_app" -T "$app/Contents/MacOS/Electron" "$qa_keychain"
          "$qa_app" --remote-debugging-port=9375 > "$RUNNER_TEMP/old.log" 2>&1 &
          old_pid=$!
          trap 'kill "$old_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/old.log"; security delete-keychain "$qa_keychain" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            kill -0 "$old_pid"
            if grep -Fq 'load-complete' "$WATCHROOM_QA_DIR/qa-runtime.log" 2>/dev/null; then break; fi
            sleep 1
          done
          grep -Fq 'load-complete' "$WATCHROOM_QA_DIR/qa-runtime.log"
          node "$probe" seed
          kill "$old_pid"
          wait "$old_pid" || true
          mv "$WATCHROOM_QA_DIR/qa-runtime.log" "$RUNNER_TEMP/qa-old-runtime.log"
          sudo installer -pkg "$pkg" -target /
          codesign --verify --strict --deep "$target"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$target/Contents/Info.plist")" = 1.0.45
          machine="$ARCH"
          if [[ "$ARCH" == x64 ]]; then machine=x86_64; fi
          lipo "$target/Contents/MacOS/Electron" -verify_arch "$machine"
          "$target/Contents/MacOS/Electron" --remote-debugging-port=9376 > "$RUNNER_TEMP/preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/preview.log"; cat "$WATCHROOM_QA_DIR/qa-runtime.log"; security delete-keychain "$qa_keychain" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            kill -0 "$pid" || exit 1
            if grep -Fq 'load-complete' "$WATCHROOM_QA_DIR/qa-runtime.log" 2>/dev/null; then
              cmp "$WATCHROOM_QA_DIR/library/watchroom-v1.json" "$RUNNER_TEMP/expected-profile.json"
              node "$probe" reveal
              echo "Updated from 1.0.44 to 1.0.45, launched, and preserved the test library"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Save PKG for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-preview-${{ matrix.arch }}
          path: ${{ runner.temp }}/output/*.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
